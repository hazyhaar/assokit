name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          check-latest: true

      # nodetree is vendored at ./nodetree (replace in go.mod) — self-contained release
      - name: Build (CGO disabled, single static binary)
        run: CGO_ENABLED=0 go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: CGO_ENABLED=0 go test ./...

      - name: Test nodetree module
        working-directory: nodetree
        run: CGO_ENABLED=0 go test ./...

      - name: Test with race detector
        run: CGO_ENABLED=1 go test -race -count=1 ./...
